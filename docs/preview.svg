<svg viewBox="0 0 680 344" width="680" role="img" xmlns="http://www.w3.org/2000/svg">
<title>A flow-trail board: three folders, one card in each</title>
<desc>Three columns. backlog holds one card with a single README: the idea, the trigger, the sketch. doing holds one card with three files: README.md, findings.md and progress.md, the last carrying the phase list and the next action. done holds one card with two files: progress.md was deleted at close.</desc>
