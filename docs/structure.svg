<svg viewBox="0 0 680 388" width="680" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Where flow-trail sits in a repository</title>
<desc>A normal project tree — src, tests, docs, package.json — untouched. One flow-trail folder holds the board: README.md and the three columns backlog, doing and done. doing holds one card, login-refactor, with README.md and findings.md kept and progress.md deleted at close. done holds the closed cards.</desc>
<text x="32" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888780">Your repository, with one board in it</text>
<rect x="32" y="44" width="616" height="304" rx="10" fill="#FFFFFF" stroke="#DCDAD3" stroke-width="0.5"/>

<text x="56" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#2C2C2A">your-project/</text>

