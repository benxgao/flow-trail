<text x="102" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5F5E5A">package.json</text>

<text x="80" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0F6E56">└─</text>
<text x="102" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0F6E56">flow-trail/</text>
<text x="322" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#5F5E5A">the board</text>

