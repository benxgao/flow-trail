<text x="322" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888780">what this folder is, one page</text>

<text x="104" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5DCAA5">├─</text>
<text x="126" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0F6E56">backlog/</text>
<text x="322" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888780">an idea that waits, one page</text>

