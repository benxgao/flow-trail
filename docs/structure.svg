<text x="150" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0F6E56">findings.md</text>
<text x="322" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#5F5E5A">the evidence behind them</text>
<text x="632" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#0F6E56" text-anchor="end">kept</text>

<text x="104" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#C0BEB6">│</text>
<text x="128" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#C0BEB6">└─</text>
<text x="150" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#A8A69E">progress.md</text>
<text x="322" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#A8A69E">where we stopped; deleted at close</text>

<text x="104" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5DCAA5">└─</text>
<text x="126" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0F6E56">done/</text>
<text x="322" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888780">closed cards: README and findings</text>

<text x="32" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#444441">One folder. Everything outside it is untouched.</text>
