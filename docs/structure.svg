<text x="126" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0F6E56">doing/</text>
<text x="322" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888780">one card at a time</text>

