<text x="632" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#A8A69E" text-anchor="end">six pages</text>
<path d="M46 80 L632 80" stroke="#EDEBE4" stroke-width="0.5"/>

