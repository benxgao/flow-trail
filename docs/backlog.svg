<svg viewBox="0 0 680 420" width="680" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Twelve weeks of parked pages, read as a roadmap</title>
<desc>A backlog folder holding six pages, oldest first, each with the week it arrived and the trigger written on it. Three of the six are about the same table. Today's request, filtering that table, points at those three. Below the folder, two lines: a closed card adds one line to the page it came from, and a page whose trigger has fired is moved into doing and becomes the plan.</desc>

<text x="32" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#888780">The backlog at week twelve</text>

